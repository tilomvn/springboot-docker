version: '3.8'

services:
  app:
    image: springbootdockermysql:1.0
    # for building image using Dockerfile
    build: .
    ports:
      - 8080:8080
    # waiting for db to complete starting up
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/springbootdb?autoReconnect=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db

  db:
    image: mysql:latest
    environment:
      DATABASE_HOST: docker-mysql
      DATABASE_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: springbootdb
      MYSQL_USER: admin
      MYSQL_PASSWORD: root
